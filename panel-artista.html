<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Panel del artista | enredARTE</title>

    <meta name="description"
        content="Panel para que artistas vean sus postulaciones, propuestas y perfil en enredARTE." />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800;900&family=Space+Mono:wght@400;700&display=swap"
        rel="stylesheet" />

    <link rel="stylesheet" href="styles.css" />
</head>

<body data-page="panel-artista">
    <header class="site-header detail-header" data-header>
        <a class="brand" href="index.html" aria-label="Volver al inicio">
            <span>enred</span><strong>ARTE</strong>
        </a>

        <nav class="main-nav" aria-label="Navegación principal">
            <a href="index.html">_home</a>
            <a href="index.html#oportunidades">_oportunidades</a>
            <a href="index.html#espacios-abiertos">_espacios</a>
        </nav>

        <button class="menu-button" type="button" aria-expanded="false" data-menu-button>
            menú
        </button>
    </header>

    <main>
        <section class="admin-hero" aria-labelledby="artist-panel-title">
            <p class="section-label">panel del artista</p>

            <h1 id="artist-panel-title">Seguí tus movimientos.</h1>

            <p>
                Revisá tus postulaciones, tus propuestas de muestra y el estado de cada oportunidad.
            </p>

            <div class="space-panel-controls">
                <label>
                    Artista
                    <select data-artist-panel-select></select>
                </label>
            </div>
        </section>

        <section class="section admin-section">
            <div class="admin-summary" data-artist-panel-summary></div>

            <div class="artist-panel-profile" data-artist-panel-profile></div>

            <div class="artist-panel-block" data-artist-panel-applications></div>

            <div class="artist-panel-block" data-artist-panel-proposals></div>
        </section>
    </main>

    <footer class="site-footer">
        <p><span>enred</span><strong>ARTE</strong></p>
        <p>Panel de seguimiento para artistas.</p>
    </footer>

    <script src="app.js"></script>
</body>

</html>
